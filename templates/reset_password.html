<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明辨 · 重置密码</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: url("../static/img/background-image.jpg") center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(145deg, rgba(0,50,90,0.5), rgba(20,80,130,0.4));
            backdrop-filter: blur(6px);
            z-index: 1;
        }
        .container {
            position: relative;
            z-index: 10;
            width: 500px;
            max-width: 95%;
        }
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 56px;
            padding: 48px 40px;
            box-shadow: 0 40px 70px -20px rgba(0,30,60,0.6);
            border: 1px solid rgba(255,255,255,0.7);
        }
        h1 {
            font-size: 2rem;
            color: #1f4462;
            margin-bottom: 12px;
            text-align: center;
        }
        .subtitle {
            color: #3f6180;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .input-row {
            margin-bottom: 20px;
        }
        .input-label {
            display: block;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1f4462;
            margin-bottom: 8px;
            margin-left: 8px;
        }
        .input-field {
            width: 100%;
            border: 2px solid #e2ecf5;
            border-radius: 40px;
            padding: 14px 24px;
            font-size: 0.95rem;
            background: white;
            transition: all 0.2s;
            outline: none;
        }
        .input-field:focus {
            border-color: #2d6fc4;
            box-shadow: 0 8px 24px -14px #2d6fc4, 0 0 0 4px rgba(45,111,196,0.1);
        }
        .password-wrapper {
            position: relative;
        }
        .password-field {
            padding-right: 50px;
        }
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8aa9c9;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #1a4f7a, #236798);
            border: none;
            padding: 16px;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 10px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 30px -14px #0f3e5e;
        }
        .message {
            padding: 12px 20px;
            border-radius: 30px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .error { background: #ffeae7; color: #b13e3e; border-left: 4px solid #b13e3e; }
        .success { background: #e0f7ea; color: #0f6e46; border-left: 4px solid #0f6e46; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>重置密码</h1>
            <p class="subtitle">请输入您的新密码</p>

            {% if error %}
            <div class="message error">{{ error }}</div>
            {% endif %}

            {% if success %}
            <div class="message success">{{ success }}</div>
            <div style="text-align: center; margin-top: 20px;">
                <a href="/login" style="color: #2d6fc4; text-decoration: none;">返回登录</a>
            </div>
            {% endif %}

            {% if valid %}
            <form method="POST">
                <div class="input-row">
                    <label class="input-label"><i class="fas fa-lock"></i> 新密码</label>
                    <div class="password-wrapper">
                        <input class="input-field password-field" type="password" name="password" placeholder="至少6位" required>
                        <button type="button" class="toggle-password" onclick="togglePwd(this)">
                            <i class="far fa-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <div class="input-row">
                    <label class="input-label"><i class="fas fa-check-circle"></i> 确认密码</label>
                    <div class="password-wrapper">
                        <input class="input-field password-field" type="password" name="confirm_password" placeholder="再次输入" required>
                        <button type="button" class="toggle-password" onclick="togglePwd(this)">
                            <i class="far fa-eye-slash"></i>
                        </button>
                    </div>
                </div>
                <button class="login-btn" type="submit">确认重置</button>
            </form>
            {% endif %}
        </div>
    </div>
    <script>
        function togglePwd(btn) {
            const input = btn.previousElementSibling;
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
            btn.querySelector('i').className = type === 'password' ? 'far fa-eye-slash' : 'far fa-eye';
        }
    </script>
</body>
</html>
