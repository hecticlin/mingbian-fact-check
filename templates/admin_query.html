{% extends "layout.html" %}

{% block content %}
<style>
    /* ===== 全局样式重置 ===== */
    * {
        box-sizing: border-box;
    }
    body {
        background: #f5f7fb;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* 页面主容器 */
    .page-container {
        padding: 2rem 2rem 3rem;
        max-width: 1400px;
        margin: 0 auto;
    }

    /* 页面标题区域 */
    .page-header {
        margin-bottom: 2rem;
    }
    .page-header h1 {
        font-size: 2.4rem;
        font-weight: 700;
        color: #0f1a2f;
        margin: 0 0 0.5rem 0;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .page-header h1 i {
        color: #1e3b5c;
        font-size: 2.4rem;
    }
    .page-header h3 {
        font-size: 1.1rem;
        font-weight: 400;
        color: #5e6f88;
        margin: 0;
        line-height: 1.6;
    }

    /* 管理卡片 - 主容器 */
    .query-management {
        background: white;
        border-radius: 32px;
        padding: 2rem 2rem 2.5rem;
        box-shadow: 0 25px 50px -18px rgba(0,40,80,0.25);
        border: 1px solid rgba(230,240,255,0.6);
        backdrop-filter: blur(2px);
        margin-top: 1.5rem;
    }

    /* 操作栏 - 现代设计 */
    .action-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
    }
    .table-switcher {
        display: flex;
        gap: 0.8rem;
        align-items: center;
    }
    .table-switcher button {
        padding: 0.7rem 1.8rem;
        background: white;
        border: 1px solid #e2ecf9;
        border-radius: 40px;
        font-weight: 500;
        color: #4f627a;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .table-switcher button i {
        font-size: 1.1rem;
    }
    .table-switcher button:hover {
        background: #eaf3ff;
        border-color: #1e3b5c40;
        color: #1e3b5c;
        transform: translateY(-2px);
    }
    .table-switcher button.active {
        background: #1e3b5c;
        border-color: #1e3b5c;
        color: white;
        box-shadow: 0 8px 14px -8px #1e3b5c;
    }

    /* 搜索区域 */
    .search-section {
        display: flex;
        gap: 0.8rem;
        align-items: center;
        background: #f8fafd;
        padding: 0.3rem;
        border-radius: 60px;
        border: 1px solid #e2ecf9;
        flex: 1;
        max-width: 500px;
    }
    .search-section input {
        padding: 0.7rem 1.5rem;
        width: 100%;
        border: none;
        background: transparent;
        font-size: 0.95rem;
        color: #1e2f4a;
    }
    .search-section input:focus {
        outline: none;
    }
    .search-section input::placeholder {
        color: #9aafc9;
    }
    .search-section button {
        padding: 0.7rem 2rem;
        background: #1e3b5c;
        color: white;
        border: none;
        border-radius: 60px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 8px 18px -8px #1e3b5c;
        white-space: nowrap;
    }
    .search-section button:hover {
        background: #0f2740;
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -10px #1e3b5c;
    }

    /* 删除选中按钮 */
    .delete-selected-btn {
        background: #dc3545;
        color: white;
        padding: 0.7rem 2rem;
        border: none;
        border-radius: 60px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 8px 18px -8px #dc3545b0;
        margin-top: 1rem;
    }
    .delete-selected-btn:hover {
        background: #b02a37;
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -10px #b02a37;
    }
    .delete-selected-btn i {
        font-size: 1.1rem;
    }

    /* 表格容器 */
    .table-wrapper {
        overflow-x: auto;
        margin: 1.5rem 0 2rem;
        border-radius: 24px;
        background: #ffffff;
        border: 1px solid #edf2f9;
    }
    .query-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
        font-size: 0.95rem;
    }
    .query-table thead th {
        background: #f8fbfe;
        color: #1e3b5c;
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 1rem 1.2rem;
        border-bottom: 2px solid #e6eefc;
        white-space: nowrap;
    }
    .query-table tbody tr {
        background: #ffffff;
        border-radius: 16px;
        transition: all 0.15s;
        box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .query-table tbody tr:hover {
        background: #fafdff;
        box-shadow: 0 8px 18px -10px #1e3b5c30;
        transform: translateY(-1px);
    }
    .query-table td {
        padding: 1rem 1.2rem;
        color: #1f2b3a;
        border: none;
    }
    .query-table td:first-child {
        border-top-left-radius: 16px;
        border-bottom-left-radius: 16px;
    }
    .query-table td:last-child {
        border-top-right-radius: 16px;
        border-bottom-right-radius: 16px;
    }

    /* 复选框样式 */
    .checkbox-custom {
        width: 18px;
        height: 18px;
        accent-color: #1e3b5c;
        cursor: pointer;
    }

    /* 分页组件 */
    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        margin: 2rem 0 1rem;
        flex-wrap: wrap;
    }
    .pagination button {
        min-width: 40px;
        height: 40px;
        padding: 0 0.8rem;
        border: 1px solid #e2ecf9;
        background: white;
        color: #4f627a;
        border-radius: 40px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .pagination button:hover:not(:disabled) {
        background: #eaf3ff;
        border-color: #1e3b5c40;
        color: #1e3b5c;
        transform: translateY(-2px);
    }
    .pagination button.active {
        background: #1e3b5c;
        border-color: #1e3b5c;
        color: white;
        box-shadow: 0 8px 14px -8px #1e3b5c;
    }
    .pagination button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* 空状态美化 */
    .empty-state {
        text-align: center;
        padding: 3rem;
        color: #8f9fb1;
    }
    .empty-state i {
        font-size: 3rem;
        margin-bottom: 1rem;
        opacity: 0.4;
    }


    /* 返回按钮 */
    .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 22px;
        background: white;
        border: 1.5px solid #d5dde8;
        border-radius: 14px;
        font-size: 0.92rem;
        font-weight: 600;
        color: #3b5068;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        white-space: nowrap;
    }
    .btn-back:hover {
        border-color: #1e3b5c;
        color: #1e3b5c;
        background: #f0f5fc;
        transform: translateX(-3px);
        box-shadow: 0 4px 14px rgba(30,59,92,0.12);
    }
    .btn-back i { font-size: 0.85rem; transition: transform 0.2s; }
    .btn-back:hover i { transform: translateX(-3px); }
    .page-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

    /* 小屏适配 */
    @media (max-width: 768px) {
        .page-container {
            padding: 1rem;
        }
        .query-management {
            padding: 1.5rem;
        }
        .action-bar {
            flex-direction: column;
            align-items: stretch;
        }
        .table-switcher {
            width: 100%;
        }
        .table-switcher button {
            flex: 1;
            justify-content: center;
        }
        .search-section {
            max-width: 100%;
        }
        .delete-selected-btn {
            width: 100%;
            justify-content: center;
        }
        .query-table td, .query-table th {
            padding: 0.8rem;
        }
    }
</style>

<!-- 引入Font Awesome图标库 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<div class="page-container">
    <!-- 页面标题区域 (完全保留原文字) -->
    <div class="page-header">
        <div>
        <h1>
            <i class="fas fa-users-cog"></i> 用户管理
        </h1>
        <h3>管理系统用户，查找、删除用户账号。</h3>
    </div>
        <a href="/admin" class="btn-back"><i class="fas fa-arrow-left"></i> 返回控制面板</a>
    </div>

    <!-- 管理卡片 -->
    <div class="query-management">
        <!-- 操作栏 -->
        <div class="action-bar">
            <div class="table-switcher">
                <button onclick="loadTable('users')" id="btn-users" class="active">
                    <i class="fas fa-user"></i> 普通用户信息
                </button>
                <button onclick="loadTable('experts')" id="btn-experts">
                    <i class="fas fa-user-tie"></i> 新闻审核专家信息
                </button>
            </div>
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="输入用户名、昵称或邮箱查询...">
                <button onclick="searchTable()">
                    <i class="fas fa-search"></i> 查询
                </button>
            </div>
        </div>

        <!-- 表格容器 -->
        <div class="table-wrapper">
            <table class="query-table" id="dataTable">
                <thead>
                    <tr id="tableHeader">
                        <!-- 表头由 JavaScript 动态生成 -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 表格内容由 JavaScript 动态生成 -->
                </tbody>
            </table>
        </div>

        <!-- 分页组件 -->
        <div class="pagination" id="pagination">
            <!-- 分页按钮由 JavaScript 动态生成 -->
        </div>

        <!-- 删除按钮 -->
        <div style="display: flex; justify-content: flex-end;">
            <button id="deleteSelectedBtn" class="delete-selected-btn" onclick="deleteSelected()">
                <i class="fas fa-trash-alt"></i> <span>删除选中用户</span>
            </button>
        </div>
    </div>
</div>

<script>
    let currentTable = 'users'; // 默认加载普通用户
    let currentPage = 1;
    const pageSize = 15;
    let selectedIds = []; // 存储选中的ID

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', function() {
        updateActiveButton();
        loadTable(currentTable);

        // 按回车键触发搜索
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchTable();
            }
        });
    });

    // 更新活动按钮样式
    function updateActiveButton() {
        document.getElementById('btn-users').classList.remove('active');
        document.getElementById('btn-experts').classList.remove('active');
        if (currentTable === 'users') {
            document.getElementById('btn-users').classList.add('active');
        } else {
            document.getElementById('btn-experts').classList.add('active');
        }
    }

    // 加载表格数据
    function loadTable(tableName) {
        currentTable = tableName;
        currentPage = 1;
        selectedIds = []; // 清空选中项
        updateActiveButton();

        // 更新删除按钮文本
        const deleteBtn = document.getElementById('deleteSelectedBtn').querySelector('span');
        deleteBtn.textContent = currentTable === 'users' ? '删除选中用户' : '删除选中专家';

        fetchData();
    }

    // 查询数据
    function searchTable() {
        currentPage = 1;
        fetchData();
    }

    // 获取数据
    function fetchData() {
        const searchText = document.getElementById('searchInput').value.trim();

        fetch(`/admin/query/data?table=${currentTable}&page=${currentPage}&pageSize=${pageSize}&search=${encodeURIComponent(searchText)}`)
            .then(response => response.json())
            .then(data => {
                renderTable(data);
                renderPagination(data.total);
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }

    // 渲染表格
    function renderTable(data) {
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');

        // 清空表格
        tableHeader.innerHTML = '';
        tableBody.innerHTML = '';
        selectedIds = []; // 清空选中项

        if (data.rows && data.rows.length > 0) {
            // 添加复选框列
            const checkboxTh = document.createElement('th');
            checkboxTh.style.width = '40px';
            checkboxTh.innerHTML = '<input type="checkbox" id="selectAll" class="checkbox-custom" onclick="toggleSelectAll()">';
            tableHeader.appendChild(checkboxTh);

            // 添加ID列
            const idTh = document.createElement('th');
            idTh.textContent = 'ID';
            tableHeader.appendChild(idTh);

            // 获取列显示名称映射
            const columnNames = {
                'user_name': '用户名',
                'export_name': '用户名',
                'user_nickname': '昵称',
                'export_nickname': '昵称',
                'admin_nickname': '昵称',
                'user_email': '邮箱',
                'export_email': '邮箱',
                'admin_email': '邮箱',
                'user_phone': '电话',
                'export_phone': '电话',
                'admin_phone': '电话',
                'user_address': '地址',
                'user_age': '年龄',
                'export_age': '年龄',
                'user_gender': '性别',
                'export_gender': '性别',
                'admin_gender': '性别',
                'create_time': '注册时间',
                'login_count': '登录次数',
                'certification_status': '认证状态',
                'approval_status': '审批状态'
            };

            // 添加其他列
            const excludeColumns = ['id', 'user_id', 'export_id', 'admin_id', 'password', 'user_password', 'export_password', 'admin_password'];
            const firstRow = data.rows[0];

            Object.keys(firstRow).forEach(key => {
                if (!excludeColumns.includes(key.toLowerCase())) {
                    const th = document.createElement('th');
                    th.textContent = columnNames[key] || key;
                    tableHeader.appendChild(th);
                }
            });

            // 填充数据行
            data.rows.forEach(row => {
                const tr = document.createElement('tr');
                const id = row.id || row.user_id || row.export_id || row.admin_id;

                // 复选框列
                const checkboxTd = document.createElement('td');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'checkbox-custom';
                checkbox.dataset.id = id;
                checkbox.onclick = (e) => {
                    e.stopPropagation();
                    toggleSelection(id);
                };
                checkboxTd.appendChild(checkbox);
                tr.appendChild(checkboxTd);

                // ID列
                const idTd = document.createElement('td');
                idTd.innerHTML = `<span style="font-weight:500;">${id}</span>`;
                tr.appendChild(idTd);

                // 其他数据列
                Object.entries(row).forEach(([key, value]) => {
                    if (!excludeColumns.includes(key.toLowerCase())) {
                        const td = document.createElement('td');

                        // 特殊字段美化
                        if (key.includes('email')) {
                            td.innerHTML = `<i class="fas fa-envelope" style="color:#8a9bb5; margin-right:5px;"></i>${value || '-'}`;
                        } else if (key.includes('phone')) {
                            td.innerHTML = `<i class="fas fa-phone" style="color:#8a9bb5; margin-right:5px;"></i>${value || '-'}`;
                        } else if (key.includes('gender')) {
                            td.innerHTML = value === '男' ? '<i class="fas fa-mars" style="color:#1e3b5c;"></i> 男' :
                                          value === '女' ? '<i class="fas fa-venus" style="color:#dc3545;"></i> 女' : '-';
                        } else if (key.includes('time')) {
                            td.innerHTML = `<i class="far fa-calendar-alt" style="color:#8a9bb5; margin-right:5px;"></i>${value || '-'}`;
                        } else if (key.includes('status')) {
                            const statusClass = value === '已认证' || value === '通过' ? 'status-certified' : 'status-pending';
                            td.innerHTML = `<span class="status-badge ${statusClass}">${value || '-'}</span>`;
                        } else {
                            td.textContent = value || '-';
                        }
                        tr.appendChild(td);
                    }
                });

                tableBody.appendChild(tr);
            });
        } else {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = 10;
            td.className = 'empty-state';
            td.innerHTML = '<i class="fas fa-inbox"></i><br>没有找到数据';
            tr.appendChild(td);
            tableBody.appendChild(tr);
        }
    }

    // 渲染分页
    function renderPagination(total) {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        const totalPages = Math.ceil(total / pageSize);
        if (totalPages <= 1) return;

        // 上一页按钮
        const prevBtn = document.createElement('button');
        prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
            if (currentPage > 1) {
                currentPage--;
                fetchData();
            }
        };
        pagination.appendChild(prevBtn);

        // 页码按钮
        const maxVisiblePages = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.textContent = i;
            if (i === currentPage) {
                pageBtn.classList.add('active');
            }
            pageBtn.onclick = () => {
                currentPage = i;
                fetchData();
            };
            pagination.appendChild(pageBtn);
        }

        // 下一页按钮
        const nextBtn = document.createElement('button');
        nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => {
            if (currentPage < totalPages) {
                currentPage++;
                fetchData();
            }
        };
        pagination.appendChild(nextBtn);
    }

    // 全选/取消全选
    function toggleSelectAll() {
        const selectAll = document.getElementById('selectAll');
        if (!selectAll) return;

        const checkboxes = document.querySelectorAll('#tableBody input[type="checkbox"]');

        selectedIds = [];
        checkboxes.forEach(checkbox => {
            checkbox.checked = selectAll.checked;
            if (selectAll.checked) {
                selectedIds.push(checkbox.dataset.id);
            }
        });
    }

    // 切换单个选择
    function toggleSelection(id) {
        const index = selectedIds.indexOf(String(id));
        if (index === -1) {
            selectedIds.push(String(id));
        } else {
            selectedIds.splice(index, 1);
        }

        // 更新全选复选框状态
        const selectAll = document.getElementById('selectAll');
        if (selectAll) {
            const checkboxes = document.querySelectorAll('#tableBody input[type="checkbox"]');
            selectAll.checked = checkboxes.length > 0 && Array.from(checkboxes).every(checkbox => checkbox.checked);
        }
    }

    // 删除选中项
    function deleteSelected() {
        if (selectedIds.length === 0) {
            alert('请至少选择一项');
            return;
        }

        if (confirm(`确定要删除选中的 ${selectedIds.length} 项吗？此操作不可恢复！`)) {
            const endpoint = currentTable === 'users' ? '/admin/query/delete_users' : '/admin/query/delete_experts';
            const payload = currentTable === 'users'
                ? { userIds: selectedIds }
                : { expertIds: selectedIds };

            fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('删除成功');
                    selectedIds = [];
                    fetchData();
                } else {
                    alert('删除失败: ' + (data.message || '未知错误'));
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('删除失败');
            });
        }
    }
</script>

<!-- 添加状态标签样式 -->

    .status-badge {
        display: inline-block;
        padding: 0.35rem 1rem;
        border-radius: 40px;
        font-size: 0.85rem;

        text-align: center;

        background: #e4f5e7;
        color: #1a6d3c;
    }
    .status-pending {
        background: #fff1d9;
        color: #a66907;
    }

{% endblock %}
