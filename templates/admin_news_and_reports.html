{% extends "layout.html" %}

{% block content %}
<style>
    /* ===== 全局样式重置 ===== */
    * {
        box-sizing: border-box;
    }
    body {
        background: #f5f7fb;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* 页面主容器 */
    .page-container {
        padding: 2rem 2rem 3rem;
        max-width: 1600px;
        margin: 0 auto;
    }

    /* 页面标题区域 */
    .page-header {
        margin-bottom: 2rem;
    }
    .page-header h1 {
        font-size: 2.2rem;
        font-weight: 700;
        color: #0f1a2f;
        margin: 0 0 0.5rem 0;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .page-header h1 i {
        color: #1e3b5c;
        font-size: 2.2rem;
    }
    .page-header h3 {
        font-size: 1.1rem;
        font-weight: 400;
        color: #5e6f88;
        margin: 0;
        line-height: 1.6;
    }

    /* 管理卡片 - 主容器 */
    .query-management {
        background: white;
        border-radius: 32px;
        padding: 2rem 2rem 2.5rem;
        box-shadow: 0 25px 50px -18px rgba(0,40,80,0.25);
        border: 1px solid rgba(230,240,255,0.6);
        backdrop-filter: blur(2px);
        margin-top: 1.5rem;
    }

    /* 操作栏 - 现代设计 */
    .action-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
    }
    .table-switcher {
        display: flex;
        gap: 0.8rem;
        align-items: center;
    }
    .table-switcher button {
        padding: 0.7rem 1.8rem;
        background: white;
        border: 1px solid #e2ecf9;
        border-radius: 40px;
        font-weight: 500;
        color: #4f627a;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .table-switcher button i {
        font-size: 1.1rem;
    }
    .table-switcher button:hover {
        background: #eaf3ff;
        border-color: #1e3b5c40;
        color: #1e3b5c;
        transform: translateY(-2px);
    }
    .table-switcher button.active {
        background: #1e3b5c;
        border-color: #1e3b5c;
        color: white;
        box-shadow: 0 8px 14px -8px #1e3b5c;
    }

    /* 搜索区域 */
    .search-section {
        display: flex;
        gap: 0.8rem;
        align-items: center;
        background: #f8fafd;
        padding: 0.3rem;
        border-radius: 60px;
        border: 1px solid #e2ecf9;
    }
    .search-section input {
        padding: 0.7rem 1.5rem;
        width: 280px;
        border: none;
        background: transparent;
        font-size: 0.95rem;
        color: #1e2f4a;
    }
    .search-section input:focus {
        outline: none;
    }
    .search-section input::placeholder {
        color: #9aafc9;
    }
    .search-section button {
        padding: 0.7rem 2rem;
        background: #1e3b5c;
        color: white;
        border: none;
        border-radius: 60px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 8px 18px -8px #1e3b5c;
    }
    .search-section button:hover {
        background: #0f2740;
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -10px #1e3b5c;
    }

    /* 删除选中按钮 */
    .delete-selected-btn {
        background: #dc3545;
        color: white;
        padding: 0.7rem 2rem;
        border: none;
        border-radius: 60px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 8px 18px -8px #dc3545b0;
        margin-left: auto;
    }
    .delete-selected-btn:hover {
        background: #b02a37;
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -10px #b02a37;
    }
    .delete-selected-btn i {
        font-size: 1.1rem;
    }

    /* 表格容器 */
    .table-wrapper {
        overflow-x: auto;
        margin: 1.5rem 0 2rem;
        border-radius: 24px;
        background: #ffffff;
        border: 1px solid #edf2f9;
    }
    .query-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 0.95rem;
    }
    .query-table thead th {
        background: #f8fbfe;
        color: #1e3b5c;
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 1rem 1.2rem;
        border-bottom: 2px solid #e6eefc;
        white-space: nowrap;
    }
    .query-table tbody tr {
        transition: all 0.15s;
        border-bottom: 1px solid #f0f5fd;
    }
    .query-table tbody tr:hover {
        background: #f5faff;
    }
    .query-table td {
        padding: 1rem 1.2rem;
        color: #1f2b3a;
        border-bottom: 1px solid #eef4fc;
    }

    /* 复选框样式 */
    .checkbox-custom {
        width: 18px;
        height: 18px;
        accent-color: #1e3b5c;
        cursor: pointer;
    }

    /* 分页组件 */
    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        margin: 2rem 0 1rem;
        flex-wrap: wrap;
    }
    .pagination button {
        min-width: 40px;
        height: 40px;
        padding: 0 0.8rem;
        border: 1px solid #e2ecf9;
        background: white;
        color: #4f627a;
        border-radius: 40px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .pagination button:hover:not(:disabled) {
        background: #eaf3ff;
        border-color: #1e3b5c40;
        color: #1e3b5c;
        transform: translateY(-2px);
    }
    .pagination button.active {
        background: #1e3b5c;
        border-color: #1e3b5c;
        color: white;
        box-shadow: 0 8px 14px -8px #1e3b5c;
    }

    /* 模态框 - 现代设计 */
    .modal {
        display: none;
        position: fixed;
        z-index: 2000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 30, 50, 0.6);
        backdrop-filter: blur(6px);
        align-items: center;
        justify-content: center;
    }
    .modal-content {
        background: white;
        margin: 0 auto;
        padding: 2.2rem 2.2rem;
        width: 90%;
        max-width: 450px;
        border-radius: 48px;
        box-shadow: 0 50px 80px -25px #0b1d31;
        animation: modalFade 0.25s;
    }
    @keyframes modalFade {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
    }
    .modal-content h3 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0f1a2f;
        margin: 0 0 1.2rem 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .modal-content h3 i {
        color: #dc3545;
        font-size: 1.8rem;
    }
    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        margin-top: 2rem;
    }
    .modal-actions button {
        padding: 0.7rem 2rem;
        border: none;
        border-radius: 40px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .confirm-btn {
        background: #dc3545;
        color: white;
        box-shadow: 0 8px 18px -8px #dc3545b0;
    }
    .confirm-btn:hover {
        background: #b02a37;
        transform: translateY(-2px);
    }
    .cancel-btn {
        background: #eef3f8;
        color: #2d405b;
    }
    .cancel-btn:hover {
        background: #dde6f0;
    }

    /* 空状态美化 */
    .empty-state {
        text-align: center;
        padding: 3rem;
        color: #8f9fb1;
    }
    .empty-state i {
        font-size: 3rem;
        margin-bottom: 1rem;
        opacity: 0.4;
    }


    /* 返回按钮 */
    .btn-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 22px;
        background: white;
        border: 1.5px solid #d5dde8;
        border-radius: 14px;
        font-size: 0.92rem;
        font-weight: 600;
        color: #3b5068;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        white-space: nowrap;
    }
    .btn-back:hover {
        border-color: #1e3b5c;
        color: #1e3b5c;
        background: #f0f5fc;
        transform: translateX(-3px);
        box-shadow: 0 4px 14px rgba(30,59,92,0.12);
    }
    .btn-back i { font-size: 0.85rem; transition: transform 0.2s; }
    .btn-back:hover i { transform: translateX(-3px); }
    .page-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

    /* 小屏适配 */
    @media (max-width: 768px) {
        .page-container {
            padding: 1rem;
        }
        .action-bar {
            flex-direction: column;
            align-items: stretch;
        }
        .table-switcher {
            width: 100%;
        }
        .table-switcher button {
            flex: 1;
            justify-content: center;
        }
        .search-section {
            width: 100%;
        }
        .search-section input {
            width: 1fr;
            flex: 1;
        }
        .delete-selected-btn {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<!-- 引入Font Awesome图标库 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<div class="page-container">
    <!-- 页面标题区域 (完全保留原文字) -->
    <div class="page-header">
        <div>
        <h1>
            <i class="fas fa-database"></i> 新闻辟谣信息管理
        </h1>
        <h3>管理系统中的新闻辟谣信息。</h3>
    </div>
        <a href="/admin" class="btn-back"><i class="fas fa-arrow-left"></i> 返回控制面板</a>
    </div>

    <!-- 管理卡片 -->
    <div class="query-management">
        <!-- 操作栏 -->
        <div class="action-bar">
            <div class="table-switcher">
                <button onclick="loadTable('news')" id="btn-news" class="active">
                    <i class="fas fa-newspaper"></i> 新闻辟谣信息
                </button>
            </div>
            <button onclick="deleteSelected()" class="delete-selected-btn">
                <i class="fas fa-trash-alt"></i> 删除选中项
            </button>
        </div>

        <!-- 搜索区域 -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="输入关键词查询...">
            <button onclick="searchTable()">
                <i class="fas fa-search"></i> 查询
            </button>
        </div>

        <!-- 表格容器 -->
        <div class="table-wrapper">
            <table class="query-table" id="dataTable">
                <thead>
                    <tr id="tableHeader">
                        <!-- 表头由 JavaScript 动态生成 -->
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- 表格内容由 JavaScript 动态生成 -->
                </tbody>
            </table>
        </div>

        <!-- 分页组件 -->
        <div class="pagination" id="pagination">
            <!-- 分页按钮由 JavaScript 动态生成 -->
        </div>
    </div>
</div>

<!-- 确认删除模态框 -->
<div id="confirmModal" class="modal">
    <div class="modal-content">
        <h3>
            <i class="fas fa-exclamation-triangle"></i> 确认删除
        </h3>
        <p id="modalMessage" style="color: #4f627a; font-size: 1rem; line-height: 1.5;">确认要删除选中的记录吗？</p>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeModal()">
                <i class="fas fa-times"></i> 取消
            </button>
            <button class="confirm-btn" onclick="confirmDelete()">
                <i class="fas fa-trash-alt"></i> 确认删除
            </button>
        </div>
    </div>
</div>

<!-- 消息提示模态框 -->
<div id="messageModal" class="modal">
    <div class="modal-content">
        <h3>
            <i class="fas fa-info-circle" style="color: #1e3b5c;"></i> 提示
        </h3>
        <p id="messageModalContent" style="color: #4f627a; font-size: 1rem; line-height: 1.5;">操作成功</p>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeMessageModal()">
                <i class="fas fa-check"></i> 确定
            </button>
        </div>
    </div>
</div>

<script>
    let currentTable = 'news'; // 默认加载的数据表
    let currentPage = 1; // 当前页码
    const pageSize = 15; // 每页显示条数
    let selectedIds = []; // 存储选中的ID
    let pendingDeleteIds = []; // 等待确认删除的ID

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', function() {
        // 初始化按钮状态
        updateActiveButton();
        loadTable(currentTable);
    });

    // 更新活动按钮样式
    function updateActiveButton() {
        document.getElementById('btn-news').classList.add('active');
    }

    // 加载表格数据
    function loadTable(tableName) {
        currentTable = tableName;
        currentPage = 1;
        selectedIds = []; // 清空选中项
        updateActiveButton();
        fetchData();
    }

    // 查询表格数据
    function searchTable() {
        const searchText = document.getElementById('searchInput').value;
        currentPage = 1;
        fetchData(searchText);
    }

    // 获取表格数据
    function fetchData(searchText = '') {
        fetch(`/admin/query/data?table=${currentTable}&page=${currentPage}&pageSize=${pageSize}&search=${encodeURIComponent(searchText)}`)
            .then(response => response.json())
            .then(data => {
                renderTable(data);
                renderPagination(data.total);
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('获取数据失败');
            });
    }

    // 渲染表格
    function renderTable(data) {
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        tableHeader.innerHTML = '';
        tableBody.innerHTML = '';
        selectedIds = []; // 清空选中项

        if (data.rows && data.rows.length > 0) {
            // 添加选择列的表头
            const selectTh = document.createElement('th');
            selectTh.innerHTML = '<input type="checkbox" id="selectAll" class="checkbox-custom" onclick="toggleSelectAll()">';
            tableHeader.appendChild(selectTh);

            // 获取ID列名
            const idColumn = currentTable === 'news' ? 'id' : 'detect_id';

            // 渲染数据列的表头
            Object.keys(data.rows[0]).forEach(key => {
                if (key !== idColumn) {
                    const th = document.createElement('th');
                    th.textContent = getColumnDisplayName(key);
                    tableHeader.appendChild(th);
                }
            });

            // 渲染表格内容
            data.rows.forEach(row => {
                const tr = document.createElement('tr');
                const rowId = row[idColumn];

                // 添加选择列
                const selectTd = document.createElement('td');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'checkbox-custom';
                checkbox.dataset.id = rowId;
                checkbox.onclick = (e) => {
                    e.stopPropagation();
                    toggleSelectRow(rowId, checkbox.checked);
                };
                selectTd.appendChild(checkbox);
                tr.appendChild(selectTd);

                // 添加数据列
                Object.entries(row).forEach(([key, value]) => {
                    if (key !== idColumn) {
                        const td = document.createElement('td');
                        td.textContent = value || '-';
                        tr.appendChild(td);
                    }
                });

                tableBody.appendChild(tr);
            });
        } else {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = 8; // 设置合适的列数
            td.className = 'empty-state';
            td.innerHTML = '<i class="fas fa-inbox"></i><br>没有数据';
            tr.appendChild(td);
            tableBody.appendChild(tr);
        }
    }

    // 获取列显示名称
    function getColumnDisplayName(key) {
        const displayNames = {
            'title': '标题',
            'content': '内容',
            'nickname': '发布人',
            'time': '发布时间',
            'news_id': '新闻ID',
            'detect_data': '检测数据',
            'detect_result': '检测结果',
            'detect_resultrate': '准确率',
            'user_name': '用户名',
            'summit_time': '提交时间',
            'reexamine_result': '复审结果'
        };
        return displayNames[key] || key;
    }

    // 渲染分页
    function renderPagination(total) {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        const totalPages = Math.ceil(total / pageSize);
        if (totalPages <= 1) return;

        // 上一页按钮
        const prevBtn = document.createElement('button');
        prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => {
            if (currentPage > 1) {
                currentPage--;
                fetchData(document.getElementById('searchInput').value);
            }
        };
        pagination.appendChild(prevBtn);

        // 页码按钮
        const maxVisiblePages = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            const button = document.createElement('button');
            button.textContent = i;
            if (i === currentPage) {
                button.classList.add('active');
            }
            button.onclick = () => {
                currentPage = i;
                fetchData(document.getElementById('searchInput').value);
            };
            pagination.appendChild(button);
        }

        // 下一页按钮
        const nextBtn = document.createElement('button');
        nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => {
            if (currentPage < totalPages) {
                currentPage++;
                fetchData(document.getElementById('searchInput').value);
            }
        };
        pagination.appendChild(nextBtn);
    }

    // 全选/取消全选
    function toggleSelectAll() {
        const selectAll = document.getElementById('selectAll');
        const checkboxes = document.querySelectorAll('#tableBody input[type="checkbox"]');

        selectedIds = [];
        checkboxes.forEach(checkbox => {
            checkbox.checked = selectAll.checked;
            if (selectAll.checked) {
                selectedIds.push(checkbox.dataset.id);
            }
        });
    }

    // 切换单行选择状态
    function toggleSelectRow(id, isChecked) {
        if (isChecked) {
            if (!selectedIds.includes(id)) {
                selectedIds.push(id);
            }
        } else {
            selectedIds = selectedIds.filter(selectedId => selectedId !== id);
            const selectAll = document.getElementById('selectAll');
            if (selectAll) selectAll.checked = false;
        }
    }

    // 删除选中的行
    function deleteSelected() {
        if (selectedIds.length === 0) {
            showMessage('请先选择要删除的记录');
            return;
        }
        showDeleteConfirmation(selectedIds);
    }

    // 显示删除确认对话框
    function showDeleteConfirmation(ids) {
        pendingDeleteIds = ids;
        const modal = document.getElementById('confirmModal');
        const message = `确认要删除选中的 ${ids.length} 条记录吗？此操作不可恢复！`;
        document.getElementById('modalMessage').textContent = message;
        modal.style.display = 'flex';
    }

    // 关闭确认对话框
    function closeModal() {
        document.getElementById('confirmModal').style.display = 'none';
    }

    // 确认删除
    function confirmDelete() {
        closeModal();
        const ids = pendingDeleteIds;

        fetch('/admin/query/delete', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                table: currentTable,
                ids: ids
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showMessage(`成功删除 ${ids.length} 条记录`);
                fetchData(document.getElementById('searchInput').value);
            } else {
                showMessage(`删除失败: ${data.message}`);
            }
        })
        .catch(error => {
            showMessage(`删除失败: ${error}`);
        });
    }

    // 显示消息对话框
    function showMessage(message) {
        document.getElementById('messageModalContent').textContent = message;
        document.getElementById('messageModal').style.display = 'flex';
    }

    // 关闭消息对话框
    function closeMessageModal() {
        document.getElementById('messageModal').style.display = 'none';
    }

    // 按回车键触发搜索
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchTable();
        }
    });

    // 点击模态框背景关闭
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    }
</script>
{% endblock %}
