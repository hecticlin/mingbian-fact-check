{% extends "layout.html" %}

{% block content %}
<!-- 引入Font Awesome图标库 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<style>
    /* ===== 全局样式重置 ===== */
    * {
        box-sizing: border-box;
    }
    body {
        background: #f5f7fb;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    /* 页面主容器 */
    .page-container {
        padding: 2rem 2rem 3rem;
        max-width: 1400px;
        margin: 0 auto;
    }

    /* 页面标题区域 */
    .page-header {
        margin-bottom: 2rem;
    }
    .page-header h1 {
        font-size: 2.4rem;
        font-weight: 700;
        color: #0f1a2f;
        margin: 0 0 0.5rem 0;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .page-header h1 i {
        color: #1e3b5c;
        font-size: 2.4rem;
    }

    /* 管理卡片 - 主容器 */
    .reexamine-management {
        background: white;
        border-radius: 32px;
        padding: 2rem 2rem 2.5rem;
        box-shadow: 0 25px 50px -18px rgba(0,40,80,0.25);
        border: 1px solid rgba(230,240,255,0.6);
        backdrop-filter: blur(2px);
        margin-top: 1.5rem;
    }

    /* 标签页容器 - 现代设计 */
    .tab-container {
        display: flex;
        gap: 0.5rem;
        margin: 1.5rem 0 2rem;
        border-bottom: 2px solid #eaf0f6;
        padding-bottom: 2px;
    }
    .tab {
        padding: 0.8rem 2rem;
        font-size: 1.1rem;
        font-weight: 600;
        color: #6b7a8f;
        background: transparent;
        border: none;
        border-radius: 40px 40px 0 0;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .tab i {
        font-size: 1.2rem;
    }
    .tab:hover {
        color: #1e2f4a;
        background: #f1f7fd;
    }
    .tab.active {
        color: #1e3b5c;
        background: #ffffff;
        box-shadow: 0 -2px 8px rgba(0,20,40,0.04), 0 4px 0 #1e3b5c;
    }

    /* 标签页内容显示控制 */
    .tab-content {
        display: none;
    }
    .tab-content.active {
        display: block;
    }

    /* 表格容器 */
    .table-wrapper {
        overflow-x: auto;
        margin: 1.5rem 0;
        border-radius: 24px;
        background: #ffffff;
        border: 1px solid #edf2f9;
    }
    .reexamine-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 8px;
        font-size: 0.95rem;
    }
    .reexamine-table thead th {
        background: #f8fbfe;
        color: #1e3b5c;
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 1rem 1.2rem;
        border-bottom: 2px solid #e6eefc;
        white-space: nowrap;
    }
    .reexamine-table tbody tr {
        background: #ffffff;
        border-radius: 16px;
        transition: all 0.15s;
        box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .reexamine-table tbody tr:hover {
        background: #fafdff;
        box-shadow: 0 8px 18px -10px #1e3b5c30;
        transform: translateY(-1px);
    }
    .reexamine-table td {
        padding: 1rem 1.2rem;
        color: #1f2b3a;
        border: none;
    }
    .reexamine-table td:first-child {
        border-top-left-radius: 16px;
        border-bottom-left-radius: 16px;
        padding-left: 1.5rem;
    }
    .reexamine-table td:last-child {
        border-top-right-radius: 16px;
        border-bottom-right-radius: 16px;
        padding-right: 1.5rem;
    }

    /* 复选框样式 */
    .checkbox-custom {
        width: 18px;
        height: 18px;
        accent-color: #1e3b5c;
        cursor: pointer;
    }

    /* 操作按钮组 */
    .action-buttons {
        display: flex;
        justify-content: flex-end;
        margin-top: 2rem;
    }
    .btn-danger {
        background: #dc3545;
        color: white;
        padding: 0.7rem 2rem;
        border: none;
        border-radius: 40px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 8px 18px -8px #dc3545b0;
        font-size: 1rem;
    }
    .btn-danger:hover {
        background: #b02a37;
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -10px #b02a37;
    }
    .btn-danger i {
        font-size: 1.1rem;
    }
    .btn-sm {
        padding: 0.4rem 1.2rem;
        font-size: 0.85rem;
        border-radius: 30px;
    }

    /* 查看按钮样式 */
    .btn-view {
        background: white;
        border: 1px solid #1e3b5c;
        color: #1e3b5c;
        padding: 0.4rem 1.2rem;
        border-radius: 30px;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .btn-view:hover {
        background: #1e3b5c;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(30, 59, 92, 0.3);
    }
    .btn-view i {
        font-size: 0.9rem;
    }

    /* 结果标签样式 */
    .result-badge {
        display: inline-block;
        padding: 0.35rem 1rem;
        border-radius: 40px;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        min-width: 90px;
    }
    .badge-real {
        background: #e4f5e7;
        color: #1a6d3c;
    }
    .badge-fake {
        background: #fee9e7;
        color: #b53b3b;
    }

    /* 空状态美化 */
    .empty-state {
        text-align: center;
        padding: 3rem;
        color: #8f9fb1;
    }
    .empty-state i {
        font-size: 3rem;
        margin-bottom: 1rem;
        opacity: 0.4;
    }

    /* 二级标题 */
    .section-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 1.2rem 0;
        font-size: 1.3rem;
        font-weight: 600;
        color: #1e3b5c;
    }
    .section-title i {
        font-size: 1.4rem;
    }

    /* 模态框 - 现代设计 */
    .modal {
        display: none;
        position: fixed;
        z-index: 2000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 30, 50, 0.6);
        backdrop-filter: blur(6px);
        align-items: center;
        justify-content: center;
    }
    .modal-content {
        background: white;
        margin: 0 auto;
        padding: 2.2rem 2.2rem;
        width: 90%;
        max-width: 800px;
        max-height: 85vh;
        overflow-y: auto;
        border-radius: 48px;
        box-shadow: 0 50px 80px -25px #0b1d31;
        animation: modalFade 0.25s;
    }
    @keyframes modalFade {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
    }
    .modal-content h3 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0f1a2f;
        margin: 0 0 1.2rem 0;
        display: flex;
        align-items: center;
        gap: 8px;
        position: sticky;
        top: 0;
        background: white;
        padding-bottom: 0.5rem;
        z-index: 10;
    }
    .modal-content h3 i {
        color: #1e3b5c;
        font-size: 1.8rem;
    }
    .modal-content p {
        color: #4f627a;
        font-size: 1rem;
        line-height: 1.5;
    }
    .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
        margin-top: 2rem;
        position: sticky;
        bottom: 0;
        background: white;
        padding-top: 1rem;
        border-top: 1px solid #eef2f6;
        z-index: 10;
    }
    .modal-buttons button {
        padding: 0.7rem 2rem;
        border: none;
        border-radius: 40px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .btn-secondary {
        background: #eef3f8;
        color: #2d405b;
    }
    .btn-secondary:hover {
        background: #dde6f0;
    }

    /* 时间戳样式 */
    .time-cell {
        white-space: nowrap;
        color: #5e6f88;
        font-size: 0.9rem;
    }
    .time-cell i {
        margin-right: 5px;
        color: #8a9bb5;
    }

    /* 详情模态框内容样式 */
    .detail-item {
        margin-bottom: 1.5rem;
    }
    .detail-label {
        font-weight: 600;
        color: #1e3b5c;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.95rem;
    }
    .detail-label i {
        color: #6b7f9a;
        font-size: 1rem;
    }
    .detail-content {
        background: #f5f9ff;
        padding: 1rem 1.2rem;
        border-radius: 16px;
        color: #1f2b3a;
        line-height: 1.6;
        word-break: break-word;
        border: 1px solid #e6eefc;
        white-space: pre-wrap;
        font-size: 0.95rem;
    }

    /* 新闻内容特殊样式 */
    .news-content {
        max-height: 300px;
        overflow-y: auto;
        background: #f5f9ff;
    }

    /* 图片预览网格样式 */
    .image-preview-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 10px;
    }

    .image-preview-item {
        position: relative;
        width: 150px;
        height: 150px;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #e2e8f0;
        cursor: pointer;
        transition: all 0.2s;
    }

    .image-preview-item:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        border-color: #1A4981;
    }

    .image-preview-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* 图片预览模态框 */
    #imagePreviewModal {
        background: rgba(0,0,0,0.9);
        backdrop-filter: blur(10px);
    }

    #imagePreviewModal .modal-content {
        background: transparent;
        box-shadow: none;
        padding: 20px;
        max-width: 90%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #imagePreviewModal img {
        max-width: 100%;
        max-height: 80vh;
        border-radius: 16px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .preview-close-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0,0,0,0.6);
        color: white;
        border: none;
        border-radius: 50%;
        width: 45px;
        height: 45px;
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        z-index: 100;
    }

    .preview-close-btn:hover {
        background: rgba(0,0,0,0.8);
        transform: scale(1.1);
    }

    /* 小屏适配 */
    @media (max-width: 768px) {
        .page-container {
            padding: 1rem;
        }
        .reexamine-management {
            padding: 1.5rem;
        }
        .tab {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
        }
        .reexamine-table td, .reexamine-table th {
            padding: 0.8rem;
        }
        .image-preview-item {
            width: 120px;
            height: 120px;
        }
    }
</style>

<div class="page-container">
    <!-- 页面标题区域 -->
    <div class="page-header">
        <h1>
            <i class="fas fa-clipboard-check"></i> 新闻复审管理
        </h1>
    </div>

    <!-- 管理卡片 -->
    <div class="reexamine-management">
        <!-- 标签页容器 -->
        <div class="tab-container">
            <div class="tab active" data-tab="pending">
                <i class="fas fa-hourglass-half"></i> 未复审
            </div>
            <div class="tab" data-tab="reviewed">
                <i class="fas fa-check-circle"></i> 已复审
            </div>
        </div>

        <!-- 未复审标签页 -->
        <div id="pending-tab" class="tab-content active">
            <div class="section-title">
                <i class="fas fa-clock" style="color:#a66907;"></i>
                <span>待复审新闻列表</span>
            </div>
            <div class="table-wrapper">
                <table class="reexamine-table">
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" id="select-all" class="checkbox-custom"></th>
                            <th>ID</th>
                            <th>提交时间</th>
                            <th>新闻标题</th>
                            <th>专家名称</th>
                            <th>图片</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="pending-news">
                        <!-- 动态加载未复审新闻 -->
                    </tbody>
                </table>
            </div>
            <div class="action-buttons">
                <button id="delete-reexamine" class="btn-danger">
                    <i class="fas fa-trash-alt"></i> 删除选中
                </button>
            </div>
        </div>

        <!-- 已复审标签页 -->
        <div id="reviewed-tab" class="tab-content">
            <div class="section-title">
                <i class="fas fa-history" style="color:#1a6d3c;"></i>
                <span>已复审新闻列表</span>
            </div>
            <div class="table-wrapper">
                <table class="reexamine-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>提交时间</th>
                            <th>复审时间</th>
                            <th>新闻标题</th>
                            <th>复审结果</th>
                            <th>图片</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="reviewed-news">
                        <!-- 动态加载已复审新闻 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 查看详情模态框（待复审和已复审共用） -->
<div id="viewDetailModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('viewDetailModal')" style="float: right; font-size: 2rem; cursor: pointer;">&times;</span>
        <h3>
            <i class="fas fa-eye"></i> 新闻详情
        </h3>
        <div id="detail-content">
            <!-- 动态加载详情内容 -->
        </div>
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="closeModal('viewDetailModal')">
                <i class="fas fa-times"></i> 关闭
            </button>
        </div>
    </div>
</div>

<!-- 确认删除模态框 -->
<div id="confirmDeleteModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('confirmDeleteModal')" style="float: right; font-size: 2rem; cursor: pointer;">&times;</span>
        <h3>
            <i class="fas fa-exclamation-triangle"></i> 确认删除
        </h3>
        <p>您确定要删除选中的复审请求吗？此操作不可恢复！</p>
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="closeModal('confirmDeleteModal')">
                <i class="fas fa-times"></i> 取消
            </button>
            <button class="btn-danger" onclick="confirmDeleteReexamine()">
                <i class="fas fa-trash-alt"></i> 确认删除
            </button>
        </div>
    </div>
</div>

<script>
    let pendingDeleteIds = [];

    // 页面加载时初始化
    document.addEventListener('DOMContentLoaded', function() {
        // 为所有标签添加点击事件
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                const tabName = this.getAttribute('data-tab');
                switchTab(tabName);
            });
        });

        // 加载未复审新闻
        loadPendingNews();

        // 批量删除按钮点击事件
        document.getElementById('delete-reexamine').addEventListener('click', function() {
            const selected = [];
            document.querySelectorAll('.reexamine-checkbox:checked').forEach(checkbox => {
                selected.push(parseInt(checkbox.value));
            });

            if (selected.length === 0) {
                alert('请至少选择一条复审请求');
                return;
            }

            pendingDeleteIds = selected;
            openModal('confirmDeleteModal');
        });
    });

    // 切换标签页
    function switchTab(tabName) {
        // 更新标签页样式
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelector(`.tab[data-tab="${tabName}"]`).classList.add('active');

        // 更新内容区域显示
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });
        document.getElementById(`${tabName}-tab`).classList.add('active');

        // 根据当前标签页加载对应的数据
        if (tabName === 'pending') {
            loadPendingNews();
        } else {
            loadReviewedNews();
        }
    }

    // 加载未复审新闻
    function loadPendingNews() {
        fetch('/user/get_pending_reexamine')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('pending-news');
                tbody.innerHTML = '';

                if (data.success && data.news && data.news.length > 0) {
                    data.news.forEach(item => {
                        // 生成图片标记
                        const imageIcon = item.has_image
                            ? '<i class="fas fa-image" style="color: #1A4981; font-size: 1.2rem;" title="有图片"></i>'
                            : '<i class="far fa-image" style="color: #ccc; font-size: 1.2rem;" title="无图片"></i>';

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><input type="checkbox" class="checkbox-custom reexamine-checkbox" value="${item.reexamine_id}"></td>
                            <td><span style="font-weight:500;">${item.reexamine_id}</span></td>
                            <td class="time-cell"><i class="far fa-calendar-alt"></i>${item.summit_time || '未知'}</td>
                            <td><strong>${escapeHtml(item.title || '无标题')}</strong></td>
                            <td><i class="fas fa-user-circle" style="color:#6b7f9a; margin-right:5px;"></i>${escapeHtml(item.export_name || '未知')}</td>
                            <td style="text-align: center;">${imageIcon}</td>
                            <td>
                                <div style="display: flex; gap: 8px;">
                                    <button class="btn-view btn-sm" onclick='openPendingViewModal(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
                                        <i class="fas fa-eye"></i> 查看
                                    </button>
                                    <button class="btn-danger btn-sm" onclick="deleteSingleReexamine(${item.reexamine_id})">
                                        <i class="fas fa-trash-alt"></i> 删除
                                    </button>
                                </div>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });

                    // 全选/取消全选
                    const selectAll = document.getElementById('select-all');
                    if (selectAll) {
                        selectAll.addEventListener('change', function() {
                            const checkboxes = document.querySelectorAll('.reexamine-checkbox');
                            checkboxes.forEach(checkbox => {
                                checkbox.checked = this.checked;
                            });
                        });
                    }
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><i class="fas fa-inbox"></i><br>暂无待复审新闻</td></tr>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('pending-news').innerHTML = `<tr><td colspan="7" class="empty-state">加载失败</td></tr>`;
            });
    }

    // 加载已复审新闻
    function loadReviewedNews() {
        fetch('/user/get_reviewed_reexamine')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('reviewed-news');
                tbody.innerHTML = '';

                if (data.success && data.news && data.news.length > 0) {
                    data.news.forEach(item => {
                        // 生成图片标记
                        const imageIcon = item.has_image
                            ? '<i class="fas fa-image" style="color: #1A4981; font-size: 1.2rem;" title="有图片"></i>'
                            : '<i class="far fa-image" style="color: #ccc; font-size: 1.2rem;" title="无图片"></i>';

                        const resultClass = item.reexamine_result === '真实新闻' ? 'badge-real' : 'badge-fake';
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td><span style="font-weight:500;">${item.reexamine_id}</span></td>
                            <td class="time-cell"><i class="far fa-calendar-alt"></i>${item.summit_time || '未知'}</td>
                            <td class="time-cell"><i class="fas fa-check-circle" style="color:#4caf50;"></i> ${item.reexamine_time || '未知'}</td>
                            <td><strong>${escapeHtml(item.title || '无标题')}</strong></td>
                            <td><span class="result-badge ${resultClass}">${escapeHtml(item.reexamine_result || '未知')}</span></td>
                            <td style="text-align: center;">${imageIcon}</td>
                            <td>
                                <button class="btn-view btn-sm" onclick='openReviewedViewModal(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
                                    <i class="fas fa-eye"></i> 查看详情
                                </button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="empty-state"><i class="fas fa-archive"></i><br>暂无已复审新闻</td></tr>`;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('reviewed-news').innerHTML = `<tr><td colspan="7" class="empty-state">加载失败</td></tr>`;
            });
    }

    // 打开待复审查看详情模态框 - 显示完整新闻内容和图片
    function openPendingViewModal(item) {
        // 生成图片HTML
        let imagesHtml = '';
        if (item.has_image && item.image_urls && item.image_urls.length > 0) {
            imagesHtml = `
                <div class="detail-item">
                    <div class="detail-label"><i class="fas fa-images"></i> 相关图片</div>
                    <div class="detail-content" style="background: transparent; padding: 0;">
                        <div class="image-preview-grid">
            `;

            item.image_urls.forEach((url, index) => {
                imagesHtml += `
                    <div class="image-preview-item" onclick="showImagePreview('${url}')">
                        <img src="${url}" alt="新闻图片${index+1}">
                    </div>
                `;
            });

            imagesHtml += `
                        </div>
                    </div>
                </div>
            `;
        }

        const content = `
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-hashtag"></i> 复审ID</div>
                <div class="detail-content">${escapeHtml(item.reexamine_id)}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-user-tie"></i> 专家名称</div>
                <div class="detail-content">${escapeHtml(item.export_name)}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-calendar-alt"></i> 提交时间</div>
                <div class="detail-content">${escapeHtml(item.summit_time)}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-newspaper"></i> 新闻标题</div>
                <div class="detail-content">${escapeHtml(item.title)}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-file-alt"></i> 新闻正文</div>
                <div class="detail-content news-content">${escapeHtml(item.content).replace(/\n/g, '<br>')}</div>
            </div>
            ${imagesHtml}
            ${renderReasoningItems(item.reasoning)}
        `;

        document.getElementById('detail-content').innerHTML = content;
        openModal('viewDetailModal');
    }

    // 打开已复审查看详情模态框 - 显示完整新闻内容和图片
    function openReviewedViewModal(item) {
        // 生成图片HTML
        let imagesHtml = '';
        if (item.has_image && item.image_urls && item.image_urls.length > 0) {
            imagesHtml = `
                <div class="detail-item">
                    <div class="detail-label"><i class="fas fa-images"></i> 相关图片</div>
                    <div class="detail-content" style="background: transparent; padding: 0;">
                        <div class="image-preview-grid">
            `;

            item.image_urls.forEach((url, index) => {
                imagesHtml += `
                    <div class="image-preview-item" onclick="showImagePreview('${url}')">
                        <img src="${url}" alt="新闻图片${index+1}">
                    </div>
                `;
            });

            imagesHtml += `
                        </div>
                    </div>
                </div>
            `;
        }

        const content = `
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-hashtag"></i> 复审ID</div>
                <div class="detail-content">${escapeHtml(item.reexamine_id)}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-user-tie"></i> 复审专家</div>
                <div class="detail-content">${escapeHtml(item.expert_name)}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-calendar-alt"></i> 提交时间</div>
                <div class="detail-content">${escapeHtml(item.summit_time)}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-clock"></i> 复审时间</div>
                <div class="detail-content">${escapeHtml(item.reexamine_time)}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-newspaper"></i> 新闻标题</div>
                <div class="detail-content">${escapeHtml(item.title)}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-file-alt"></i> 新闻正文</div>
                <div class="detail-content news-content">${escapeHtml(item.content).replace(/\n/g, '<br>')}</div>
            </div>
            ${imagesHtml}
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-tag"></i> 复审结果</div>
                <div class="detail-content"><span class="result-badge ${item.reexamine_result === '真实新闻' ? 'badge-real' : 'badge-fake'}">${escapeHtml(item.reexamine_result)}</span></div>
            </div>
            <div class="detail-item">
                <div class="detail-label"><i class="fas fa-pen"></i> 复审理由</div>
                <div class="detail-content">${escapeHtml(item.reexamine_reason) || '无'}</div>

        `;

        document.getElementById('detail-content').innerHTML = content;
        openModal('viewDetailModal');
    }

    // 图片预览
    function showImagePreview(imageUrl) {
        // 移除已存在的预览模态框
        const existingModal = document.getElementById('imagePreviewModal');
        if (existingModal) {
            existingModal.remove();
        }

        const modalHtml = `
            <div class="modal" id="imagePreviewModal" style="display: flex;">
                <div class="modal-content">
                    <button class="preview-close-btn" onclick="closeImagePreview()">&times;</button>
                    <img src="${imageUrl}" alt="预览图片">
                </div>
            </div>
        `;

        document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function closeImagePreview() {
        const modal = document.getElementById('imagePreviewModal');
        if (modal) {
            modal.remove();
        }
    }

    // reasoning 检测原因渲染（沿用 detail-item 样式，不改UI）
    function renderReasoningItems(r) {
        if (!r || !r.final_reason) return '';
        var html = '';
        html += '<div class="detail-item">'
             +  '<div class="detail-label"><i class="fas fa-brain"></i> 检测原因</div>'
             +  '<div class="detail-content" style="white-space:pre-line;">' + escapeHtml(r.final_reason) + '</div>'
             +  '</div>';
        if (r.short_circuited && r.short_circuit_source) {
            html += '<div class="detail-item">'
                 +  '<div class="detail-label"><i class="fas fa-bolt"></i> 核查来源</div>'
                 +  '<div class="detail-content">' + escapeHtml(r.short_circuit_source) + '</div>'
                 +  '</div>';
        }
        if (r.branch_results && r.branch_results.length > 0) {
            var fakeN = r.branch_results.filter(function(b){return b.verdict==='虚假新闻';}).length;
            var bHtml = r.branch_results.map(function(b) {
                var icon = b.verdict==='虚假新闻'?'❌':b.verdict==='真实新闻'?'✅':'❓';
                var clr  = b.verdict==='虚假新闻'?'#c0392b':b.verdict==='真实新闻'?'#1e7e34':'#6c757d';
                var dis  = '';
                if (!b.agreed && b.initial_verdict) {
                    dis = '<div style="margin-top:5px;padding:6px 10px;background:#fff8f0;border-left:3px solid #fd7e14;border-radius:4px;font-size:.82rem;color:#7b4b00;">'
                        + '⚠ 两阶段分歧 — 初判：' + escapeHtml(b.initial_verdict) + '，复核：' + escapeHtml(b.review_verdict||'') + '</div>';
                }
                return '<div style="padding:6px 0;border-bottom:1px solid #f0f0f0;">'
                     + '<b style="color:'+clr+';">'+icon+' '+escapeHtml(b.branch_label)+'</b>'
                     + '<div style="font-size:.88rem;color:#444;margin-top:3px;">'+escapeHtml(b.reason||'')+'</div>'+dis+'</div>';
            }).join('');
            html += '<div class="detail-item">'
                 +  '<div class="detail-label"><i class="fas fa-list-check"></i> 分支分析（'+r.branch_results.length+'个，'+fakeN+'个判虚假）</div>'
                 +  '<div class="detail-content" style="padding:10px 14px;">'+bHtml+'</div>'
                 +  '</div>';
        }
        return html;
    }

    // HTML转义函数
    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return String(unsafe)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 删除单个复审请求
    function deleteSingleReexamine(reexamineId) {
        pendingDeleteIds = [reexamineId];
        openModal('confirmDeleteModal');
    }

    // 确认删除
    function confirmDeleteReexamine() {
        deleteReexamine(pendingDeleteIds);
    }

    // 提交删除请求
    function deleteReexamine(reexamineIds) {
        fetch('/user/delete_reexamine', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                reexamine_ids: reexamineIds
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                closeModal('confirmDeleteModal');
                alert('删除成功');
                // 刷新当前标签页
                const activeTab = document.querySelector('.tab.active').getAttribute('data-tab');
                if (activeTab === 'pending') {
                    loadPendingNews();
                } else {
                    loadReviewedNews();
                }
            } else {
                alert('删除失败: ' + data.message);
            }
        })
        .catch(error => {
            console.error('删除失败:', error);
            alert('删除失败: ' + error);
        });
    }

    // 打开模态框
    function openModal(modalId) {
        document.getElementById(modalId).style.display = 'flex';
    }

    // 关闭模态框
    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // 点击模态框背景关闭
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    }
</script>
{% endblock %}
